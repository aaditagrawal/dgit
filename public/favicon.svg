<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF2ED"/>
      <stop offset="100%" stop-color="#FFD6C9"/>
    </linearGradient>
    <filter id="arrowShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#DD2C00" flood-opacity="0.25"/>
    </filter>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="120"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Ring Shadow -->
    <ellipse cx="256" cy="435" rx="100" ry="50" fill="#D84315" opacity="0.15" filter="blur(12px)"/>
    
    <!-- Tube (Branch) -->
    <g stroke-width="2" stroke-linejoin="round">
      <path d="M -50 483 L 156 380 L 156 390 L -50 493 Z" fill="#FFCA28" stroke="#FFCA28"/>
      <path d="M -50 493 L 156 390 L 156 410 L -50 513 Z" fill="#FF8F00" stroke="#FF8F00"/>
    </g>

    <!-- Ring Outer Thickness -->
    <path d="M 156 380 A 100 50 0 0 0 356 380 L 356 410 A 100 50 0 0 1 156 410 Z" fill="#FFB300"/>

    <!-- Ring Inner Thickness (Back of hole) -->
    <path d="M 206 380 A 50 25 0 0 1 306 380 L 306 410 A 50 25 0 0 0 206 410 Z" fill="#FF8F00"/>

    <!-- Ring Top Face (Full) -->
    <path d="M 156 380 A 100 50 0 1 0 356 380 A 100 50 0 1 0 156 380 M 206 380 A 50 25 0 1 1 306 380 A 50 25 0 1 1 206 380" fill-rule="evenodd" fill="#FFE082"/>

    <!-- Arrow -->
    <g filter="url(#arrowShadow)">
      <g stroke-width="3" stroke-linejoin="round">
        <path d="M 256 110 L 296 130 L 256 150 L 216 130 Z" fill="#FF9E80" stroke="#FF9E80"/>
        <path d="M 216 130 L 256 150 L 256 250 L 216 230 Z" fill="#FF6E40" stroke="#FF6E40"/>
        <path d="M 256 150 L 296 130 L 296 230 L 256 250 Z" fill="#DD2C00" stroke="#DD2C00"/>
        <path d="M 176 230 L 256 270 L 256 250 L 216 230 Z" fill="#FF9E80" stroke="#FF9E80"/>
        <path d="M 256 270 L 336 230 L 296 230 L 256 250 Z" fill="#FF9E80" stroke="#FF9E80"/>
        <path d="M 176 230 L 256 270 L 256 410 Z" fill="#FF6E40" stroke="#FF6E40"/>
        <path d="M 256 270 L 336 230 L 256 410 Z" fill="#DD2C00" stroke="#DD2C00"/>
      </g>
    </g>

    <!-- Ring Front Half Top Face (Sandwich) -->
    <path d="M 156 380 A 100 50 0 0 0 356 380 L 306 380 A 50 25 0 0 1 206 380 Z" fill="#FFE082"/>
  </g>
</svg>